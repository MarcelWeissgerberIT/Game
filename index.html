<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1420">
  <meta name="description" content="Hotel Nocturne: escape the rooms of a mysterious art deco hotel. One door, one riddle at a time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nocturne">
  <title>Hotel Nocturne</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/ui/icon-192.png">
  <link rel="apple-touch-icon" href="assets/ui/icon-192.png">
  <link rel="preload" as="image" href="assets/ui/title.webp">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Title screen -->
    <section id="screen-title" class="screen stage-wrap">
      <div class="stage">
        <img class="room" src="assets/ui/title.webp" alt="The lobby of Hotel Nocturne">
        <div class="title-ui">
          <div class="title-spacer"></div>
          <div class="title-buttons">
            <button id="btn-play" class="btn btn-primary">Check in</button>
            <button id="btn-levels" class="btn btn-ghost">Choose a room</button>
          </div>
          <p class="title-foot">Tap, swipe, tilt and shake your way through the hotel.</p>
        </div>
      </div>
    </section>

    <!-- Level select -->
    <section id="screen-levels" class="screen stage-wrap hidden">
      <div class="stage panel-stage">
        <header class="panel-head">
          <button class="icon-btn" id="btn-levels-back" aria-label="Back">&#8592;</button>
          <h1>Floor One</h1>
          <button class="icon-btn" id="btn-reset" aria-label="Reset progress" title="Reset progress">&#8635;</button>
        </header>
        <div id="level-grid" class="level-grid"></div>
        <p class="panel-foot">More doors are being renovated. Check back soon.</p>
      </div>
    </section>

    <!-- Game screen -->
    <section id="screen-game" class="screen stage-wrap hidden">
      <div class="stage" id="stage">
        <img class="room" id="room-img" alt="">
        <div class="layer" id="layer"></div>
        <div class="door-glow" id="door-glow"></div>
        <header class="hud">
          <button class="icon-btn" id="btn-menu" aria-label="Menu">&#8592;</button>
          <div class="hud-title" id="hud-title">Room 101</div>
          <button class="icon-btn" id="btn-hint" aria-label="Hint">?</button>
        </header>
        <div class="inventory" id="inventory"></div>
        <div class="toast" id="toast"></div>
        <div class="modal hidden" id="modal">
          <div class="modal-card" id="modal-card"></div>
        </div>
        <div class="fade" id="fade"></div>
      </div>
    </section>

  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
